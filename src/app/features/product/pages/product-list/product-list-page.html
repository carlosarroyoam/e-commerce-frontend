<header>
  <h1 class="heading">Products</h1>
  <p class="mt-1 text-sm">
    A list of all the products in the catalog including their title, category, and status.
  </p>
</header>

<section class="my-8">
  <form [formGroup]="form">
    <div class="grid gap-x-4 gap-y-2 md:grid-cols-2 xl:grid-cols-4">
      <div class="space-y-1">
        <label appInputLabel for="title">Title</label>
        <input
          appInput
          id="title"
          type="text"
          maxlength="64"
          autocomplete="off"
          placeholder="Title"
          formControlName="title"
        />
        <app-input-error [control]="form.get('title')" />
      </div>

      <div class="space-y-1">
        <label appInputLabel for="slug">Slug</label>
        <input
          appInput
          id="slug"
          type="text"
          maxlength="64"
          autocomplete="off"
          placeholder="Slug"
          formControlName="slug"
        />
        <app-input-error [control]="form.get('slug')" />
      </div>

      <div class="space-y-1">
        <label appInputLabel for="category-id-trigger">Category</label>
        <app-select
          id="category-id"
          placeholder="All categories"
          [options]="categoryOptions()"
          formControlName="categoryId"
        />
        <app-input-error [control]="form.get('categoryId')" />
      </div>

      <div class="space-y-1">
        <label appInputLabel for="is-featured-trigger">Featured</label>
        <app-select
          id="is-featured"
          placeholder="All products"
          [options]="featuredOptions"
          formControlName="isFeatured"
        />
        <app-input-error [control]="form.get('isFeatured')" />
      </div>

      <div class="space-y-1">
        <label appInputLabel for="isActive-trigger">Status</label>
        <app-select
          id="isActive"
          placeholder="All statuses"
          ariaLabel="Status filter"
          [options]="activeOptions"
          formControlName="isActive"
        />
        <app-input-error [control]="form.get('isActive')" />
      </div>

      <div class="space-y-1">
        <label appInputLabel for="start-date">Start date</label>
        <input
          appInput
          id="start-date"
          type="date"
          aria-describedby="date-range-error"
          [attr.aria-invalid]="form.hasError('dateRange') ? 'true' : null"
          formControlName="startDate"
        />
        <app-input-error [control]="form.get('startDate')" />
      </div>

      <div class="space-y-1">
        <label appInputLabel for="end-date">End date</label>
        <input
          appInput
          id="end-date"
          type="date"
          aria-describedby="date-range-error"
          [attr.aria-invalid]="form.hasError('dateRange') ? 'true' : null"
          formControlName="endDate"
        />
        <app-input-error [control]="form.get('endDate')" />
      </div>

      <button
        appButton
        type="button"
        variant="secondary"
        (click)="reset()"
        class="mb-1 self-end lg:max-w-32"
      >
        Clear
      </button>
    </div>

    <div class="mt-4">
      <app-input-error id="date-range-error" [control]="form" />
    </div>
  </form>
</section>

<section>
  <app-table [table]="table" [isLoading]="store.isLoading()" />
  <app-paginator
    [page]="queryParams().page!"
    [size]="queryParams().size!"
    [pagination]="store.pagination()"
    (pageChanged)="onPageChange($event)"
    (sizeChanged)="onSizeChange($event)"
  />
</section>
