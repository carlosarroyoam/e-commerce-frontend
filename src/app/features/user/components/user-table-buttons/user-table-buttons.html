<button appButton variant="outline" size="icon" (click)="onView()">
  <span class="sr-only">View user</span>
  <svg lucideEye class="size-3.5"></svg>
</button>

<button appButton variant="outline" size="icon" (click)="onEdit()">
  <span class="sr-only">Edit user</span>
  <svg lucidePencil class="size-3.5"></svg>
</button>

@if (isDeleted) {
  <button appButton variant="outline" size="icon" (click)="onRestore()">
    <span class="sr-only">Restore user</span>
    <svg lucideRotateCcw class="size-3.5"></svg>
  </button>
} @else {
  <button appButton variant="outline" size="icon" (click)="onDelete()">
    <span class="sr-only">Delete user</span>
    <svg lucideTrash2 class="size-3.5"></svg>
  </button>
}
