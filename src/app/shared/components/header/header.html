<header class="border-b border-zinc-200 bg-zinc-50 lg:hidden">
  <div class="container flex min-h-18 items-center justify-between py-3">
    <a
      routerLink="/dashboard"
      class="rounded-md text-lg font-semibold tracking-tight text-zinc-950 outline-offset-4 focus-visible:outline-2 focus-visible:outline-zinc-900"
    >
      e-commerce
    </a>

    <button
      type="button"
      aria-controls="mobile-sidebar"
      [attr.aria-expanded]="isSidebarOpen()"
      (click)="toggleSidebar()"
      class="rounded-md p-2 text-zinc-700 outline-offset-2 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-2 focus-visible:outline-zinc-900"
    >
      <span class="sr-only">Toggle navigation</span>
      <svg lucideMenu aria-hidden="true" [strokeWidth]="1.8" class="size-6"></svg>
    </button>
  </div>
</header>
