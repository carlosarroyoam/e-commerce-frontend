<!-- Modal container -->
<app-modal-container>
  <div class="flex flex-col">
    <!-- Dialog title -->
    <h2 id="dialog-title" class="text-center font-semibold text-zinc-900 sm:text-left">
      {{ data.title }}
    </h2>

    @if (data.description) {
      <!-- Dialog description -->
      <p id="dialog-description" class="mt-1 text-center text-sm sm:text-left">
        {{ data.description }}
      </p>
    }
  </div>

  <!-- Dismiss button -->
  <div class="absolute top-5 right-5 hidden sm:block">
    <span class="sr-only">Close dialog</span>
    <button (click)="closeDialog()">
      <svg lucideX aria-hidden="true" class="size-6 hover:cursor-pointer"></svg>
    </button>
  </div>

  <!-- Dialog footer -->
  <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
    @if (data.showSecondaryButton) {
      <button appButton type="button" [variant]="'secondary'" (click)="cancel()">
        {{ data.secondaryButtonLabel ?? 'Cancel' }}
      </button>
    }

    <button appButton type="button" (click)="accept()">
      {{ data.primaryButtonLabel ?? 'Accept' }}
    </button>
  </div>
</app-modal-container>
