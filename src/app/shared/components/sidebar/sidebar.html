<aside
  class="sticky top-0 hidden h-dvh flex-col border-r border-zinc-100 bg-zinc-50 px-4 py-6 lg:flex"
>
  <ng-container [ngTemplateOutlet]="header" />
  <ng-container [ngTemplateOutlet]="navigation" />
  <ng-container [ngTemplateOutlet]="footer" />
</aside>

@if (isSidebarOpen()) {
  <div
    class="fixed inset-0 z-40 bg-zinc-950/30 lg:hidden"
    aria-hidden="true"
    (click)="closeSidebar()"
  ></div>

  <aside
    id="mobile-sidebar"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    role="dialog"
    aria-modal="true"
    aria-label="Primary navigation"
    (keydown.escape)="closeSidebar()"
    class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col border-r border-zinc-100 bg-zinc-50 px-4 py-5 shadow-xl lg:hidden"
  >
    <ng-container [ngTemplateOutlet]="header" />
    <ng-container [ngTemplateOutlet]="navigation" />
    <ng-container [ngTemplateOutlet]="footer" />
  </aside>
}

<ng-template #header>
  <div class="mb-6 flex items-center justify-between">
    <a
      routerLink="/dashboard"
      (click)="closeSidebar()"
      class="rounded-md px-3 text-lg font-semibold tracking-tight text-zinc-950 outline-offset-4"
    >
      e-commerce
    </a>

    <button
      type="button"
      (click)="closeSidebar()"
      class="block rounded-md p-2 text-zinc-600 outline-offset-2 hover:bg-zinc-100 hover:text-zinc-800 lg:hidden"
    >
      <span class="sr-only">Close navigation</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        class="size-5 text-zinc-500"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</ng-template>

<ng-template #navigation>
  <nav aria-label="Primary navigation" class="flex-1">
    <ul class="space-y-1">
      @for (item of navigationItems; track item.id) {
        <li>
          <a
            routerLinkActive="bg-zinc-100 text-zinc-700"
            ariaCurrentWhenActive="page"
            [routerLink]="item.route"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            (click)="closeSidebar()"
            class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-500 outline-offset-2 transition-colors hover:bg-zinc-100 hover:text-zinc-700"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              class="size-5"
            >
              @switch (item.icon) {
                @case ('dashboard') {
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                  />
                }

                @case ('orders') {
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"
                  />
                }

                @case ('products') {
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"
                  />
                }

                @case ('categories') {
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12"
                  />
                }

                @case ('customers') {
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                  />
                }

                @case ('users') {
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                  />
                }
              }
            </svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</ng-template>

<ng-template #footer>
  @if (authSession()) {
    <section class="mt-6 border-t border-zinc-200" aria-label="Signed-in user">
      <div class="mt-5 flex items-center gap-3 px-3">
        <img [src]="avatarSrc()" [alt]="avatarAlt()" class="size-10 rounded-full bg-zinc-200" />
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-zinc-950">{{ authSession()?.full_name }}</p>
          <p class="truncate text-sm text-zinc-600">{{ authSession()?.email }}</p>
        </div>
      </div>

      <button
        type="button"
        (click)="logout.emit()"
        class="mt-4 flex w-full cursor-pointer items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-500 outline-offset-2 hover:bg-zinc-100 hover:text-zinc-700"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M18 12H9m9 0-3-3m3 3-3 3"
          />
        </svg>
        Log out
      </button>
    </section>
  }
</ng-template>
