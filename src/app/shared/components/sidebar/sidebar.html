<aside
  class="sticky top-0 hidden h-dvh flex-col border-r border-zinc-100 bg-zinc-50 px-4 py-6 lg:flex"
>
  <ng-container [ngTemplateOutlet]="header" />
  <ng-container [ngTemplateOutlet]="navigation" />
  <ng-container [ngTemplateOutlet]="footer" />
</aside>

@if (isSidebarOpen()) {
  <div
    class="fixed inset-0 z-40 bg-zinc-950/30 lg:hidden"
    aria-hidden="true"
    (click)="closeSidebar()"
  ></div>

  <aside
    id="mobile-sidebar"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    role="dialog"
    aria-modal="true"
    aria-label="Primary navigation"
    (keydown.escape)="closeSidebar()"
    class="fixed inset-y-0 left-0 z-50 flex w-80 flex-col border-r border-zinc-100 bg-zinc-50 px-4 py-5 shadow-xl lg:hidden"
  >
    <ng-container [ngTemplateOutlet]="header" />
    <ng-container [ngTemplateOutlet]="navigation" />
    <ng-container [ngTemplateOutlet]="footer" />
  </aside>
}

<ng-template #header>
  <header class="mb-6 flex items-center justify-between">
    <a
      routerLink="/dashboard"
      (click)="closeSidebar()"
      class="rounded-md px-3 text-lg font-semibold tracking-tight text-zinc-950 outline-offset-4"
    >
      e-commerce
    </a>

    <button
      type="button"
      (click)="closeSidebar()"
      class="block rounded-md p-2 text-zinc-600 outline-offset-2 hover:bg-zinc-100 hover:text-zinc-800 lg:hidden"
    >
      <span class="sr-only">Close navigation</span>
      <svg lucideX aria-hidden="true" [strokeWidth]="1.8" class="size-5 text-zinc-500"></svg>
    </button>
  </header>
</ng-template>

<ng-template #navigation>
  <nav aria-label="Primary navigation" class="flex-1">
    <ul class="space-y-1">
      @for (item of navigationItems; track item.id) {
        <li>
          <a
            routerLinkActive="bg-zinc-100 text-zinc-700"
            ariaCurrentWhenActive="page"
            [routerLink]="item.route"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            (click)="closeSidebar()"
            class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-500 outline-offset-2 transition-colors hover:bg-zinc-100 hover:text-zinc-700"
          >
            <svg
              [lucideIcon]="navIcon(item.icon)"
              aria-hidden="true"
              [strokeWidth]="1.8"
              class="size-5"
            ></svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</ng-template>

<ng-template #footer>
  @if (authSession()) {
    <footer class="mt-6 border-t border-zinc-200" aria-label="Signed-in user">
      <div class="mt-5 flex items-center gap-3 px-3">
        <img [src]="avatarSrc()" [alt]="avatarAlt()" class="size-10 rounded-full bg-zinc-200" />
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-zinc-950">{{ authSession()?.full_name }}</p>
          <p class="truncate text-sm text-zinc-600">{{ authSession()?.email }}</p>
        </div>
      </div>

      <button
        type="button"
        (click)="logout.emit()"
        class="mt-4 flex w-full cursor-pointer items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-500 outline-offset-2 hover:bg-zinc-100 hover:text-zinc-700"
      >
        <svg lucideLogOut aria-hidden="true" [strokeWidth]="1.8" class="size-5"></svg>
        Log out
      </button>
    </footer>
  }
</ng-template>
